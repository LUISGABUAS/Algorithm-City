<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algorithm City</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230b1226'/><path d='M11 6 H6 V26 H11' fill='none' stroke='%235eead4' stroke-width='2.4' stroke-linejoin='round'/><path d='M21 6 H26 V26 H21' fill='none' stroke='%235eead4' stroke-width='2.4' stroke-linejoin='round'/><path d='M12 11 L17 16 L12 21' fill='none' stroke='%23e8eef8' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><rect x='17.5' y='20' width='5' height='2.4' rx='1' fill='%23fbbf24'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#0b1020;--panel:#151c35;--panel2:#1d2648;--line:#2d3a6b;--line2:#3c4c88;
  --ink:#e8eef8;--dim:#97a3c7;--mint:#5eead4;--mint2:#2dd4bf;--gold:#fbbf24;--gold2:#d99a0b;
  --ok:#4ade80;--bad:#f87171;--ol:#0a0d1a;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.45 "Pixelify Sans",ui-monospace,Menlo,monospace;min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.px{font-family:"Silkscreen","Pixelify Sans",monospace;letter-spacing:.5px}

/* ---------- HUD ---------- */
#hud{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 14px;background:linear-gradient(#1a2347,#121937);border-bottom:3px solid var(--ol);box-shadow:0 2px 0 var(--line2)}
.ava{width:46px;height:46px;border:3px solid var(--gold2);background:#2a6f8f;box-shadow:inset 0 0 0 2px var(--ol)}
.who{line-height:1.1;margin-right:auto;min-width:0}
.who b{display:block;font-size:17px}
.who span{color:var(--gold);font-size:13px}
.lvl{display:flex;align-items:center;gap:8px}
.lvb{width:38px;height:38px;border-radius:50%;background:radial-gradient(#26305c,#10162e);border:3px solid var(--ol);box-shadow:0 0 0 2px var(--line2);display:grid;place-items:center;font-family:Silkscreen;font-size:9px;line-height:1;text-align:center}
.lvb b{font-size:15px;display:block}
.xpw{width:150px}
.xpb{height:10px;background:#0d1229;border:2px solid var(--ol);box-shadow:0 0 0 1px var(--line2)}
.xpb i{display:block;height:100%;background:linear-gradient(var(--mint),var(--mint2));transition:width .4s}
.xpt{font-size:12px;color:var(--dim)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:5px;background:#0f1530;border:2px solid var(--ol);box-shadow:0 0 0 1px var(--line);padding:3px 8px;font-size:14px;white-space:nowrap}
.chip small{color:var(--dim);font-family:Silkscreen;font-size:9px;display:block;line-height:1}
.chip.gold{box-shadow:0 0 0 1px var(--gold2)}
main{max-width:1180px;margin:0 auto;padding:16px 14px 70px}
h1{font-family:Silkscreen;font-size:20px;margin:4px 0;color:var(--mint);font-weight:700}
.sub,.hint{color:var(--dim);margin:0 0 12px;font-size:15px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--gold);color:#1a1300;padding:8px 16px;font-weight:700;display:none;z-index:60;border:3px solid var(--ol)}
.mapmode main{max-width:none;padding:0}
.mapmode{overflow:hidden}
.mapmode .mapwrap{margin:0;border:0;outline:0;height:calc(100vh - var(--hudh,64px));height:calc(100dvh - var(--hudh,64px))}
.mapmode .mapwrap canvas#map{width:100%;height:100%}
.maphint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(11,16,32,.85);border:2px solid var(--ol);box-shadow:0 0 0 1px rgba(94,234,212,.6);padding:6px 12px;font-size:14px;white-space:nowrap;pointer-events:none;transition:opacity .8s;z-index:3}
.maphint b{color:var(--gold)}
.maphint.off{opacity:0}
body.touch .maphint{bottom:150px;white-space:normal;width:86%;text-align:center}
.bhead{position:sticky;top:var(--hudh,64px);z-index:15}
.dir{top:calc(var(--hudh,64px) + var(--bheadh,90px) + 10px)!important}
.floor{scroll-margin-top:calc(var(--hudh,64px) + var(--bheadh,90px) + 8px)}
.door2{cursor:pointer;padding:0}
.door2:hover{background:#c9ecff}
.exitsign{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:6px;font-family:Silkscreen;font-size:12px;background:#b3261e;color:#fff;border:2px solid var(--ol);padding:2px 8px;white-space:nowrap;box-shadow:0 2px 0 var(--ol)}
@media (max-width:560px){.bhead{gap:8px;padding:8px 10px}.bhead .stat{display:none}.bicon{height:38px}.btitle b{font-size:16px}.bhead .pbtn{padding:6px 9px;font-size:11px}}
.bmode main{max-width:none;padding:12px 16px 30px}
.bmode .layout{grid-template-columns:230px 1fr}
.room.filler{cursor:default;opacity:.92}
.room.filler:hover{transform:none;box-shadow:0 0 0 2px #39477f}
.room.filler .rnm{color:var(--dim)}
@media (max-width:820px){.bmode .layout{grid-template-columns:1fr}}
.avab{background:none;border:0;padding:0}
.who{background:none;border:0;text-align:left;padding:0;cursor:pointer}
.who .tap{font-style:normal;color:var(--dim);font-size:12px}
.who:hover b{color:var(--mint)}
.avab:hover .ava{border-color:var(--mint)}
.blbl{font-size:15px!important;font-weight:700;padding:5px 10px!important;border:3px solid var(--ol)!important;box-shadow:0 0 0 2px rgba(94,234,212,.75),0 4px 0 rgba(0,0,0,.35)!important;background:rgba(14,20,42,.92)!important;min-width:140px}
.blbl .bn{display:block;font-family:"Pixelify Sans",monospace;letter-spacing:.3px}
.blbl small{font-size:12px!important;font-weight:400}
.blbl .bp{display:block;height:6px;margin-top:4px;background:#0a0d1a;border:1px solid #2d3a6b}
.blbl .bp b{display:block;height:100%;background:var(--ok)}
.blbl.done{box-shadow:0 0 0 2px var(--gold),0 4px 0 rgba(0,0,0,.35)!important}
#mini{height:80px!important}
.mdlg{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(680px,92%);display:none;gap:12px;background:#0f1530;border:4px solid var(--ol);box-shadow:0 0 0 3px #e8eef8;padding:10px 12px;z-index:6}
.mdlg canvas{width:58px;height:58px;flex:none;background:#2a6f8f;border:3px solid var(--ol)}
.mdlg .nm{font-family:Silkscreen;font-size:12px;color:var(--gold);margin-bottom:3px}
.mdlg .say{font-size:16px;line-height:1.35}
body.touch .mdlg{bottom:150px}
.modal{position:fixed;inset:0;background:rgba(5,8,18,.72);z-index:70;display:flex;align-items:flex-start;justify-content:flex-start;padding:76px 14px 14px;overflow:auto}
.mcard{position:relative;width:min(720px,100%);background:linear-gradient(#1b2449,#141b38);border:4px solid var(--ol);box-shadow:0 0 0 3px var(--gold2),0 10px 30px rgba(0,0,0,.6);padding:16px}
.mx{position:absolute;top:10px;right:10px;width:34px;height:34px;background:#0f1530;border:3px solid var(--ol);box-shadow:0 0 0 1px var(--line2);font-size:16px}
.mtop{display:flex;gap:14px;align-items:center}
.mtop canvas{width:92px;height:92px;background:#2a6f8f;border:4px solid var(--gold2);box-shadow:inset 0 0 0 2px var(--ol)}
.mlab{font-family:Silkscreen;font-size:12px;color:var(--mint)}
#mname{font:700 24px "Pixelify Sans",monospace;color:#fff;background:transparent;border:0;border-bottom:2px dashed var(--line2);padding:0;width:100%;max-width:340px}
#mname:focus{outline:none;border-bottom-color:var(--mint)}
.mtitle{color:var(--gold);font-size:17px;font-weight:700}
.mrank{display:inline-block;margin-top:4px;font-size:13px;background:#3a2a10;border:2px solid var(--gold2);padding:1px 8px;color:#ffe7a8}
.mlvl{display:flex;gap:12px;align-items:center;margin:14px 0;background:#0f1530;border:3px solid var(--ol);padding:10px}
.lvbig{font-family:Silkscreen;font-size:11px;text-align:center;background:#c78a3a;color:#1a1300;border:3px solid var(--ol);padding:4px 10px;line-height:1}
.lvbig b{display:block;font-size:26px}
.mxp{font-size:14px;margin-bottom:6px;color:var(--dim)}.mxp b{color:#fff}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mst{background:#10172f;border:2px solid var(--ol);box-shadow:0 0 0 1px var(--line);padding:8px 10px}
.mst1{font-size:14px;color:var(--ink);font-weight:700}.mst2{font-size:22px;color:var(--gold);font-weight:700;line-height:1.1}.mst3{font-size:12px;color:var(--dim)}
.msec{font-family:Silkscreen;font-size:12px;color:var(--gold);margin:14px 0 8px;display:flex;justify-content:space-between}
.msec span{color:var(--dim)}
.mpath{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.mstep{background:#10172f;border:2px solid var(--ol);padding:4px 8px;text-align:center;opacity:.55;font-size:13px}
.mstep b{display:block;font-family:Silkscreen;font-size:11px;color:var(--dim)}
.mstep.on{opacity:1}.mstep.cur{box-shadow:0 0 0 2px var(--mint);background:#173a3a}
.mline{width:14px;height:3px;background:#2d3a6b}.mline.on{background:var(--mint)}
.mach{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ach{background:#10172f;border:2px solid var(--ol);padding:6px;text-align:center;opacity:.5}
.ach.on{opacity:1;box-shadow:0 0 0 1px var(--gold2)}
.ach span{font-size:20px;display:block}.ach b{font-size:12px;display:block}.ach small{font-size:11px;color:var(--dim);display:block;line-height:1.2}
.mfoot{margin-top:12px;font-size:12px;color:var(--dim)}
@media (max-width:560px){.mgrid{grid-template-columns:1fr 1fr}.mach{grid-template-columns:1fr 1fr}.mtop canvas{width:64px;height:64px}#mname{font-size:19px}.modal{padding-top:60px}.blbl{min-width:0;font-size:12px!important}.blbl small{font-size:10px!important}}
.quest{position:absolute;left:10px;top:10px;max-width:min(420px,70%);background:rgba(14,20,42,.9);border:3px solid var(--ol);box-shadow:0 0 0 2px var(--gold2);padding:6px 10px;font-size:14px;line-height:1.3;z-index:4;pointer-events:none}
.quest .qk{display:block;font-family:Silkscreen;font-size:11px;color:var(--gold)}
.quest b{color:#fff}
.quest .qs{display:block;font-size:12px;color:var(--mint)}
.route{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:3px;z-index:4;pointer-events:none}
.rn{display:flex;align-items:center;gap:6px;background:rgba(14,20,42,.88);border:2px solid var(--ol);box-shadow:0 0 0 1px var(--line);padding:2px 8px 2px 4px;font-size:12px;opacity:.75}
.rn span{width:20px;text-align:center}
.rn b{font-family:Silkscreen;font-size:10px;color:var(--dim)}
.rn em{font-style:normal}
.rn.done{box-shadow:0 0 0 1px var(--gold2);opacity:.95}
.rn.open{opacity:1}
.rn.lock em{color:var(--dim)}
.rn.here{box-shadow:0 0 0 2px var(--mint);opacity:1;transform:translateX(-6px)}
.zban{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%);background:rgba(14,20,42,.92);border:4px solid var(--ol);box-shadow:0 0 0 3px var(--gold2);padding:10px 26px;text-align:center;font-family:Silkscreen;font-size:22px;color:#fff;opacity:0;pointer-events:none;z-index:5;white-space:nowrap}
.zban small{display:block;font-size:12px;color:var(--gold)}
.zban.on{animation:zb 2.8s ease forwards}
@keyframes zb{0%{opacity:0;transform:translate(-50%,-30%)}12%{opacity:1;transform:translate(-50%,-50%)}80%{opacity:1}100%{opacity:0}}
@media (max-width:560px){.route{display:none}.quest{max-width:calc(100% - 20px);font-size:12px}.zban{font-size:16px;padding:8px 14px}}
.code{margin:10px 0 0;background:#0b1124;border:3px solid var(--ol);box-shadow:0 0 0 2px var(--line2);padding:10px 12px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#e8eef8;overflow:auto;white-space:pre}
.hk{color:#c9a8ff}.hs{color:#86efac}.hn{color:#fdba74}.hc{color:#7f8db3}.hb{background:var(--gold);color:#1a1300;padding:0 2px}
.trace{margin-top:10px;overflow:auto}
.trace table{border-collapse:collapse;width:100%;font-size:14px;background:#0f1530}
.trace th{background:#1d2648;color:var(--gold);font-family:Silkscreen;font-size:11px;text-align:left}
.trace th,.trace td{border:2px solid var(--ol);padding:5px 8px}
.trace tr:last-child td{color:var(--ok)}
.recap{margin:4px 0 0;padding-left:20px;text-align:left}.recap li{margin:3px 0}
.bquest{flex-basis:100%;text-align:left;background:#2a2412;border:2px solid var(--gold2);color:#ffe7a8;padding:6px 10px;font-size:15px}
.bquest span{font-family:Silkscreen;font-size:11px;color:var(--gold);margin-right:8px}
.bquest b{color:#fff}.bquest em{font-style:normal;color:var(--mint)}
.room.classroom{box-shadow:0 0 0 2px var(--gold)}
.rbadge.cls{background:var(--gold);color:#1a1300;animation:blink2 1.2s steps(2) infinite}
@keyframes blink2{50%{filter:brightness(1.3)}}
.room.needclass canvas{filter:grayscale(1) brightness(.5)}
.lockc{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(10,13,26,.9);border:2px solid var(--gold2);color:var(--gold);font-size:13px;padding:4px 8px;white-space:nowrap;z-index:2}
.lesson .stage{max-width:calc((100vh - 170px)*1.43)}
#lprev:disabled,#lnext:disabled{opacity:.45;cursor:not-allowed}
.goal{margin-top:10px;background:#10172f;border:2px solid var(--gold2);padding:8px 10px;font-size:15px}
.goal span{display:block;font-family:Silkscreen;font-size:11px;color:var(--gold)}
.expl{margin-top:8px;background:#10172f;border:2px solid var(--ol);box-shadow:0 0 0 1px var(--line);padding:6px 10px;font-size:14px}
.expl summary{cursor:pointer;color:var(--mint)}
.expl div{display:flex;gap:10px;margin-top:6px;align-items:baseline}
.expl code{flex:none;background:#0b1124;padding:1px 6px;color:#c9a8ff;font:13px ui-monospace,Menlo,monospace;white-space:pre}
.ed{display:grid;grid-template-columns:40px 1fr;margin-top:10px;background:#0b1124;border:3px solid var(--ol);box-shadow:0 0 0 2px var(--mint2);height:clamp(190px,34vh,360px)}
.edgut{overflow:hidden;background:#0e1530;color:#56608a;font:14px/21px ui-monospace,Menlo,Consolas,monospace;text-align:right;padding:8px 6px 8px 0;user-select:none}
.edgut div.err{color:#fff;background:var(--bad)}
.edwrap{position:relative;min-width:0;overflow:hidden}
.edhl,.edwrap textarea{position:absolute;inset:0;margin:0;padding:8px 10px;font:14px/21px ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow:auto;tab-size:4;border:0;letter-spacing:0}
.edhl{color:#e8eef8;pointer-events:none}
.edwrap textarea{background:transparent;color:transparent;caret-color:#fff;resize:none;outline:none;-webkit-text-fill-color:transparent}
.edwrap textarea::selection{background:rgba(94,234,212,.35);-webkit-text-fill-color:transparent}
.edwrap:focus-within{box-shadow:inset 0 0 0 1px var(--mint)}
.edbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.edbar .pbtn{padding:7px 12px}
.edbar .pbtn:disabled{opacity:.5;cursor:not-allowed}
.edkeys{font-size:12px;color:var(--dim);margin-left:auto}
.hintb{margin-top:8px;background:#2a2412;border:2px solid var(--gold2);padding:6px 10px;font-size:14px;white-space:pre-wrap}
.hintb b{font-family:Silkscreen;font-size:11px;color:var(--gold);margin-right:6px}
.res{margin-top:10px;border:3px solid var(--ol);padding:8px 10px;font-size:14px}
.res.good{background:#123323;box-shadow:0 0 0 2px var(--ok)}
.res.bad{background:#3a1717;box-shadow:0 0 0 2px var(--bad)}
.res .t{font-family:Silkscreen;font-size:12px;margin-bottom:4px}
.res .errl{font:14px ui-monospace,Menlo,monospace;color:#ffd0d0}
.res .tip{margin-top:6px;color:#ffe7a8}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:8px;padding:3px 0;border-top:1px solid rgba(255,255,255,.08)}
.tl li>span{flex:1;min-width:0}
.tl li:first-child{border-top:0}
.tl li.ok b{color:var(--ok)}.tl li.no b{color:var(--bad)}
.tl code{font:13px ui-monospace,Menlo,monospace;background:rgba(0,0,0,.25);padding:0 4px;word-break:break-all}
.tl em{color:#ffe7a8;font-style:normal}
.console{margin-top:8px;background:#0b1124;border:3px solid var(--ol);padding:8px 10px}
.console .t{font-family:Silkscreen;font-size:11px;color:var(--dim)}
.console pre{margin:4px 0 0;font:14px ui-monospace,Menlo,monospace;white-space:pre-wrap;color:#e8eef8;max-height:160px;overflow:auto}
.coding .cgrid{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}
.rbadge.lockb{background:#2a3150;color:var(--dim)}
.room.needprev canvas{filter:grayscale(1) brightness(.55)}
.gout{margin-top:6px}.gout small{display:block;font-size:12px;color:var(--dim)}
.gout pre{margin:4px 0 0;background:#0b1124;border:2px solid var(--ol);padding:6px 10px;font:14px/1.45 ui-monospace,Menlo,monospace;color:#e8eef8;white-space:pre-wrap}
.odiff{border-collapse:collapse;margin:6px 0;font-size:13px;width:100%}
.odiff th{font-family:Silkscreen;font-size:10px;color:var(--dim);text-align:left;padding:2px 6px;font-weight:normal}
.odiff td{padding:3px 6px;border-top:1px solid rgba(255,255,255,.08);vertical-align:top}
.odiff tr.ok td:first-child{color:var(--ok)}.odiff tr.no td:first-child{color:var(--bad)}
.odiff tr.no{background:rgba(239,68,68,.12)}.odiff i{color:var(--dim)}
.res em code{background:rgba(0,0,0,.25);padding:0 4px;font:13px ui-monospace,Menlo,monospace}
.gloss{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:13px;color:var(--dim)}
.gloss .gw{background:#10172f;border:2px solid var(--ol);box-shadow:0 0 0 1px var(--line);color:var(--mint);padding:2px 8px;font:13px ui-monospace,Menlo,monospace;cursor:pointer;border-bottom:2px dotted var(--mint)}
.gloss .gw.on{background:var(--mint);color:#062a24}
.gdef{flex-basis:100%;background:#0f1a2e;border:2px solid var(--mint2);padding:6px 10px;color:var(--ink);font-size:14px}
.gdef b{color:var(--mint);margin-right:6px}
.blank{background:rgba(251,191,36,.25);color:var(--gold);outline:1px dashed var(--gold);border-radius:2px}
.tobadge{font-family:Silkscreen;font-size:11px;background:var(--gold);color:#1a1300;padding:3px 8px}
#skipc{padding:6px 10px;font-size:12px}
.lvmodal{align-items:flex-start;justify-content:flex-start;padding:20px 14px}
.lvmodal .mcard{width:min(640px,100%);margin:auto}
.lvh{font-family:"Pixelify Sans",system-ui,sans-serif;font-size:26px;line-height:1.15;margin:6px 40px 6px 0;color:#fff;text-wrap:balance}
.lvp{margin:0 0 12px;color:var(--dim);font-size:14px}
.lvopts{display:grid;gap:10px}
.lvopt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#10172f;border:3px solid var(--ol);box-shadow:0 0 0 2px var(--line);padding:10px 12px;color:var(--ink);cursor:pointer}
.lvopt:hover,.lvopt:focus-visible{box-shadow:0 0 0 2px var(--mint)}
.lvopt.cur{box-shadow:0 0 0 2px var(--gold)}
.lvopt b{display:block;font-size:17px;color:#fff}.lvopt small{display:block;font-size:13px;color:var(--dim);margin-top:2px;line-height:1.35}
.lvopt.quiz{background:#141b38}
.lvic{font-size:26px;line-height:1;flex:none}
.plq{display:grid;gap:10px}.plq b{font-size:17px}.plq pre.code{margin:0}
.plo{display:grid;gap:8px}
.lvmini{display:flex;flex-wrap:wrap;gap:8px}
.mexp{display:flex;gap:12px;align-items:center;margin-top:12px;background:#10172f;border:2px solid var(--ol);box-shadow:0 0 0 1px var(--line);padding:8px 12px}
.mexp b{font-size:16px}
/* ---- configuración ---- */

    +'<div class="cgrid"><div class="cl"><div class="stage" id="stage"><canvas id="stagec" width="160" height="112"></canvas><div class="tbox"><div class="tbar"><i id="tb" style="width:100%"></i></div><span class="tnum" id="tm">'+TIME+'s</span></div></div></div><div class="cside">'
    +'<div class="dlg" id="dlg"><canvas id="por" width="32" height="32"></canvas><div style="flex:1;min-width:0"><div class="nm">'+esc(n.name)+' · '+esc(n.role)+'</div><div class="say" id="say"></div></div></div>'
    +(c.code?'<pre class="code">'+hl(c.code)+'</pre>':'')+'<div class="ohint" id="ohint">'+(document.body.classList.contains("touch")?'👇 Toca una respuesta':'👇 Elige una respuesta · teclas A–D · Esc para salir')+'</div><div class="opts" id="opts">';
  c.opts.forEach(function(o,i){h+='<button class="opt" data-i="'+i+'"><span class="k">'+"ABCD"[i]+'</span><span>'+esc(o)+'</span></button>'});
  h+='</div><div id="after"></div></div></div></div>';
  $("main").innerHTML=h;
  drawStage("new");
  var pc=$("por").getContext("2d");pc.imageSmoothingEnabled=false;pc.drawImage(npcSprite(n.seed),0,0,32,32,0,1,32,31);
  typeInto($("say"),lineFor(c,r));
  $("dlg").onclick=finishType;
  $("bk").onclick=function(){stop();if(RUN.mode==="exam"&&!confirmLeave())return;var w=RUN.w,f=RUN.f;RUN=null;fadeTo(function(){building(w,f)})};
  [].forEach.call(document.querySelectorAll(".opt"),function(b){b.onclick=function(){answer(+b.dataset.i)}});
  tick=setInterval(function(){RUN.left--;var tb=$("tb"),tm=$("tm");if(!tb){stop();return}
    tb.style.width=(Math.max(0,RUN.left)/TIME*100)+"%";tb.className=RUN.left<=20?"low":"";tm.textContent=Math.max(0,RUN.left)+"s";
    if(RUN.left<=0)answer(-1)},1000);
  window.scrollTo(0,0);
}
function confirmLeave(){return true}
function pop(text,cls){var st=$("stage");if(!st)return;var p=document.createElement("div");p.className="pop "+(cls||"");p.textContent=text;st.appendChild(p);setTimeout(function(){p.remove()},1400)}
function answer(i){
  if(!RUN||RUN.answered)return;RUN.answered=true;if(tick){clearInterval(tick);tick=null}finishType();
  var c=RUN.list[RUN.i],ok=i===c.ok,first=!ST.solved[c._id],before=levelInfo();
  var xp=ok?(first?25:5)+(RUN.left>=90?5:0):(i<0?0:3),coins=ok&&first?10:0;
  ST.att=(ST.att||0)+1;srsCase(c,ok);if(ok){ST.solved[c._id]=1;ST.streak=(ST.streak||0)+1;ST.hits=(ST.hits||0)+1;RUN.score++;if(ST.streak>(ST.bestStreak||0))ST.bestStreak=ST.streak}else ST.streak=0;
  ST.xp+=xp;ST.coins=(ST.coins||0)+coins;RUN.xp+=xp;RUN.coins+=coins;RUN.res[RUN.i]=ok;save();hud();
  var after=levelInfo();if(after.lv>before.lv)setTimeout(function(){toast(after.capped?"¡Nivel "+after.lv+"! Es el máximo de este mundo: acredita el edificio para seguir subiendo":"¡Subiste a nivel "+after.lv+"!")},700);
  [].forEach.call(document.querySelectorAll(".opt"),function(b){var j=+b.dataset.i;b.disabled=true;if(j===c.ok)b.classList.add("ok");else if(j===i)b.classList.add("bad")});
  drawStage(ok?"ok":"bad");
  pop(ok?"+"+xp+" XP"+(coins?"  +"+coins+" 🪙":""):(i<0?"⏱ TIEMPO":"+"+xp+" XP"),ok?"ok":"");
  var sayLine=ok?pick(OKL):((i<0?"¡Se acabó el tiempo! ":pick(BADL)+" ")+"La respuesta era «"+c.opts[c.ok]+"».");
  if(RUN.mode==="exam")sayLine=ok?"Correcto. Anotado.":(i<0?"Tiempo. ":"Incorrecto. ")+"Era «"+c.opts[c.ok]+"».";
  typeInto($("say"),sayLine);
  var last=RUN.i===RUN.list.length-1;
  $("after").innerHTML='<div class="nextrow"><button class="pbtn mint" id="nx">'+(last?'VER RESULTADO ▶':'SIGUIENTE ▶')+'</button></div>'
    +'<div class="why"><div class="t">📘 EXPLICACIÓN</div>'+esc(c.why)
    +(c.sl?' <a target="_blank" rel="noopener" href="https://leetcode.com/problems/'+encodeURIComponent(c.sl)+'/">Abrir en LeetCode ↗</a>':'')+'</div>';
  $("nx").onclick=next;var oh=$("ohint");if(oh)oh.textContent=document.body.classList.contains("touch")?"✔ Lee la explicación y toca Siguiente":"✔ Lee la explicación y presiona Siguiente (Enter)";
  setTimeout(function(){var nx=$("nx");if(nx&&nx.getBoundingClientRect().bottom>window.innerHeight)nx.scrollIntoView({behavior:"smooth",block:"end"})},250);
}
function next(){if(!RUN||!RUN.answered)return;if(RUN.i<RUN.list.length-1){RUN.i++;showCase()}else result()}
function result(){
  stop();document.body.classList.remove("bmode");var w=RUN.w,n=RUN.list.length,h;
  if(RUN.mode==="exam"){
    var pass=RUN.score>=EXAM_PASS,firstPass=pass&&!ST.exam[w];
    if(firstPass){ST.exam[w]=1;ST.gems=(ST.gems||0)+1;ST.coins=(ST.coins||0)+50;setTimeout(function(){toast("🎉 ¡Ascenso! Ahora eres "+RANKS[examsDone()])},900)}save();hud();
    h='<div class="case result"><div class="cgrid"><div class="cl"><div class="stage"><canvas id="stagec" width="160" height="112"></canvas></div></div><div class="cside">'
      +'<div class="dlg" style="cursor:default"><canvas id="por" width="32" height="32"></canvas><div style="flex:1"><div class="nm">Jurado · Aula Magna</div><div class="say" id="say"></div></div></div>'
      +'<div class="big">'+RUN.score+'/'+n+'</div><div class="rw"><span class="stat">+<b>'+RUN.xp+'</b> XP</span><span class="stat">+<b>'+(RUN.coins+(firstPass?50:0))+'</b> 🪙</span>'+(firstPass?'<span class="stat">+<b>1</b> 💎</span>':'')+'</div>'
      +'<div class="nextrow" style="justify-content:center"><button class="pbtn" id="b1">'+(pass?'Volver al edificio':'Repasar pisos')+'</button>'+(pass?'<button class="pbtn mint" id="b2">Ir al mapa ▶</button>':'<button class="pbtn gold" id="b2">Intentar de nuevo ▶</button>')+'</div></div></div></div>';
    $("main").innerHTML=h;var c=$("stagec").getContext("2d");c.imageSmoothingEnabled=false;drawAuditorium(c,w,{player:true});
    var pc=$("por").getContext("2d");pc.imageSmoothingEnabled=false;pc.drawImage(npcSprite(9001),0,0,32,32,0,1,32,31);
    typeInto($("say"),pass?(firstPass?"¡Felicidades! El jurado acredita "+WORLDS[w].nm+". Tu bandera ya ondea en el mapa.":"Aprobado otra vez. Buen repaso."):"Necesitabas "+EXAM_PASS+" aciertos. Repasa los pisos y vuelve cuando estés listo.");
    $("b1").onclick=function(){fadeTo(function(){building(w)})};
    $("b2").onclick=pass?function(){fadeTo(campus)}:function(){openExam(w)};
    return;
  }
  var r=RUN.room,f=RUN.f,fd=floorData(w,f),nextR=fd.rooms[r.idx+1],solvedAll=roomSolved(r)===r.cases.length;
  h='<div class="case result"><div class="cgrid"><div class="cl"><div class="stage"><canvas id="stagec" width="160" height="112"></canvas></div></div><div class="cside">'
    +'<div class="dlg" style="cursor:default"><canvas id="por" width="32" height="32"></canvas><div style="flex:1"><div class="nm">'+esc(r.npc.name)+' · '+esc(r.npc.role)+'</div><div class="say" id="say"></div></div></div>'
    +'<div class="big">'+RUN.score+'/'+n+'</div><div class="rw"><span class="stat">+<b>'+RUN.xp+'</b> XP</span><span class="stat">+<b>'+RUN.coins+'</b> 🪙</span><span class="stat">Piso: <b>'+Math.round(floorStats(w,f).dom*100)+'%</b> dominio</span></div>'
    +'<div class="nextrow" style="justify-content:center"><button class="pbtn" id="b1">Volver al edificio</button>'
    +(solvedAll?'':'<button class="pbtn gold" id="b3">Reintentar sala</button>')
    +(nextR?'<button class="pbtn mint" id="b2">Siguiente sala ▶</button>':'')+'</div></div></div></div>';
  $("main").innerHTML=h;
  var c2=$("stagec").getContext("2d");c2.imageSmoothingEnabled=false;drawRoom(c2,r,{big:true,player:true,mood:solvedAll?"ok":"half"});
  var pc2=$("por").getContext("2d");pc2.imageSmoothingEnabled=false;pc2.drawImage(npcSprite(r.npc.seed),0,0,32,32,0,1,32,31);
  typeInto($("say"),solvedAll?"¡Listo! Con esto ya puedo hacer mi PR. Gracias por la ayuda.":"Avanzamos, pero todavía hay algo que no me queda claro. ¿Lo repasamos?");
  $("b1").onclick=function(){fadeTo(function(){building(w,f)})};
  if($("b3"))$("b3").onclick=function(){openRoom(w,f,r.idx)};
  if(nextR)$("b2").onclick=function(){openRoom(w,f,r.idx+1)};
}

document.addEventListener("keydown",function(e){
  if(MAPON)return;
  if(!RUN){if(e.key==="Escape"&&$("bk")){e.preventDefault();$("bk").click()}return}
  if(e.key==="Escape"){var bk=$("bk");if(bk)bk.click();return}
  if(!RUN.answered){var i="abcd".indexOf(e.key.toLowerCase());if(i<0)i="1234".indexOf(e.key);if(i>=0&&i<RUN.list[RUN.i].opts.length){answer(i);return}}
  else if(e.key==="Enter"||e.key===" "){e.preventDefault();next()}
});

campus();
hud();
setTimeout(function(){if(typeof CFG!=="undefined"&&!CFG.revWarn)return;var n=srsDueList().length;if(n)toast("📚 Tienes "+n+" repaso"+(n>1?"s":"")+" pendiente"+(n>1?"s":"")+" hoy · toca REPASO arriba")},1500);
})();
</script>
</body>
</html>
